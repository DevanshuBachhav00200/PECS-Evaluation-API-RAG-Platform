[pytest]
# Repo-wide pytest configuration (FOUND-006).
#
# pythonpath: put the repository root on sys.path so `import src.…` resolves no
# matter how pytest is invoked. Without this, only `python -m pytest` works —
# that form prepends the current working directory, whereas a bare `pytest`
# does not, so every test module failed with `ModuleNotFoundError: No module
# named 'src'`. Paths are relative to rootdir (the directory holding this file).
# Requires pytest >= 7.0; the project runs pytest 9.x.
pythonpath = .

# Collect from tests/ when pytest is called with no arguments, instead of
# walking the whole repository (src/, scripts/, benchmark/ …).
testpaths = tests
